<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 Full-Year B&W Journal</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,700;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
  
  <!-- html2canvas + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    /* ——— RESET & BASE ——— */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2efec;
      color: #1e1a16;
      padding: 24px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #app { max-width: 1200px; margin: 0 auto; }

    /* ——— HEADER ——— */
    header {
      text-align: center;
      padding: 20px 20px 16px;
      background: #faf8f6;
      border-radius: 28px;
      margin-bottom: 24px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: -0.5px;
      color: #111;
    }
    header p {
      font-weight: 600;
      font-size: 1rem;
      color: #2d2d2d;
      opacity: 0.8;
    }

    /* ——— SETTINGS ——— */
    .settings-panel {
      background: #faf8f6;
      padding: 18px 24px;
      border-radius: 24px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
      justify-content: center;
    }
    .settings-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .settings-group label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #111;
      min-width: 50px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-group button {
      padding: 6px 16px;
      border: 2px solid #1e1a16;
      background: white;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      color: #1e1a16;
    }
    .btn-group button:hover { background: #e6e2dd; }
    .btn-group button.active {
      background: #1e1a16;
      color: white;
    }
    .btn-generate, .btn-download {
      padding: 10px 28px;
      border: 2px solid #1e1a16;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      background: white;
      color: #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    .btn-generate:hover, .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e1a16;
      background: #f0ede8;
    }

    /* ——— JOURNAL PREVIEW ——— */
    .journal-preview {
      background: #fcfaf8;
      padding: 24px 20px;
      border-radius: 28px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      min-height: 500px;
    }

    /* ——— PAGE STYLES ——— */
    .journal-page {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 32px;
      padding: 28px 32px; /* Reduced outer page padding for more writing area */
      background: white;
      border-radius: 12px;
      border: 2px solid #2d2d2d;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      page-break-after: always;
      position: relative;
      min-height: 750px;
      color: #1a1a1a;
      font-family: 'Source Serif 4', 'Georgia', serif;
      font-size: 11pt;
      line-height: 1.5;
    }

    .journal-page .section-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 1.6rem;
      border-bottom: 3px solid #1a1a1a;
      padding-bottom: 6px;
      margin-bottom: 14px;
      letter-spacing: -0.2px;
      color: #111;
      line-height: 1.2;
    }

    /* Cover */
    .journal-page.cover {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 780px;
      border: 4px solid #1a1a1a;
      background: #faf8f6;
      font-family: 'Playfair Display', serif;
    }
    .journal-page.cover h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #111;
      line-height: 1.1;
    }
    .journal-page.cover .year {
      font-size: 6.5rem;
      font-weight: 800;
      color: #111;
      border: 4px solid #111;
      padding: 0.05em 0.3em;
      border-radius: 20px;
      background: white;
      margin: 16px 0;
      line-height: 1;
    }
    .cover-icon { font-size: 5rem; margin-bottom: 8px; line-height: 1; }

    /* Month Grid */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
      font-weight: 600;
      font-size: 0.75rem;
      border: 2px solid #2d2d2d;
      border-radius: 8px;
      padding: 6px;
      background: #fcfaf8;
      font-family: 'Inter', sans-serif;
    }
    .month-grid .day-header {
      font-weight: 800;
      padding: 3px 0;
      color: #111;
      border-bottom: 2px solid #2d2d2d;
      font-size: 0.65rem;
    }
    .month-grid .day {
      padding: 4px 0;
      border-radius: 4px;
      font-weight: 700;
      background: white;
      font-size: 0.7rem;
    }
    .month-grid .day.weekend { color: #b13e3e; }
    .month-grid .day.empty { opacity: 0.25; }

    /* Year Calendar */
    .year-calendar-page .calendar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .year-calendar-page .month-card {
      border: 2px solid #1e1a16;
      border-radius: 10px;
      padding: 6px;
      background: #fcfaf8;
    }
    .year-calendar-page .month-card .month-name {
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 4px;
      padding-bottom: 2px;
      border-bottom: 2px solid #1e1a16;
    }

    /* Vision Board */
    .vision-board-page .bingo-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 2px;
      color: #111;
      margin-bottom: 6px;
    }
    .vision-board-page .bingo-subtitle {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      opacity: 0.7;
      margin-bottom: 50px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .vision-board-page .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .vision-board-page .bingo-cell {
      border: 2px solid #1e1a16;
      border-radius: 8px;
      padding: 20px 4px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      background: #fcfaf8;
      min-height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }
    .vision-board-page .bingo-cell .icon { font-size: 1.4rem; display: block; margin-bottom: 2px; }
    .vision-board-page .bingo-free { background: #1e1a16; color: white; font-size: 0.85rem; }
    .vision-board-page .bingo-footer {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border-top: 2px solid #1a1a1a;
      padding-top: 10px;
      margin-top: 4px;
      color: #111;
    }

    /* Combined Planner */
    .combined-planner-page .section-title-sm {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 1.15rem;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: #111;
    }
    .combined-planner-page .planner-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .combined-planner-page .planner-box {
      border: 2px solid #1e1a16;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fcfaf8;
    }
    .combined-planner-page .travel-item, .combined-planner-page .budget-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px dashed #ddd;
    }

    /* WEEKLY PLANNER STYLES */
    .weekly-planner-page {
      background: #ffffff;
      border-color: #1e1a16;
    }
    .weekly-planner-page .wp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #1e1a16;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .weekly-planner-page .wp-header .wp-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #111;
    }
    .weekly-planner-page .wp-header .wp-badge {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      background: #1e1a16;
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .weekly-planner-page .wp-top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .weekly-planner-page .wp-block {
      border: 2px solid #1e1a16;
      border-radius: 10px;
      padding: 8px 12px;
      background: #faf8f6;
    }
    .weekly-planner-page .wp-block-title {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .weekly-planner-page .wp-priority-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .weekly-planner-page .wp-priority-item .checkbox {
      width: 13px;
      height: 13px;
      border: 2px solid #1e1a16;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .weekly-planner-page .wp-priority-item .line {
      flex: 1;
      border-bottom: 1.5px dashed #aaa;
      height: 18px;
    }
    .weekly-planner-page .wp-day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 12px;
    }
    .weekly-planner-page .wp-day-card {
      border: 2px solid #1e1a16;
      border-radius: 8px;
      background: #ffffff;
      min-height: 270px; /* Increased height for longer daily task lists */
      display: flex;
      flex-direction: column;
    }
    .weekly-planner-page .wp-day-card.weekend {
      background: #faf8f6;
    }
    .weekly-planner-page .wp-day-header {
      background: #1e1a16;
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 0.65rem;
      text-align: center;
      padding: 4px 2px;
      text-transform: uppercase;
    }
    .weekly-planner-page .wp-day-card.weekend .wp-day-header {
      background: #4a423a;
    }
    .weekly-planner-page .wp-day-body {
      padding: 6px 3px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .weekly-planner-page .wp-day-task {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .weekly-planner-page .wp-day-task .mini-check {
      width: 9px;
      height: 9px;
      border: 1.5px solid #1e1a16;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .weekly-planner-page .wp-day-task .task-line {
      flex: 1;
      border-bottom: 1px dashed #ccc;
      height: 16px;
    }
    .weekly-planner-page .wp-bottom-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    .weekly-planner-page .wp-habit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed #ddd;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .weekly-planner-page .wp-habit-dots {
      display: flex;
      gap: 4px;
    }
    .weekly-planner-page .wp-habit-dot {
      width: 11px;
      height: 11px;
      border: 1.5px solid #1e1a16;
      border-radius: 50%;
    }

    /* Daily Journal Page */
    .daily-journal-page .journal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #111;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .daily-journal-page .journal-header .date { font-size: 1.6rem; font-weight: 900; font-family: 'Playfair Display', serif; }
    .daily-journal-page .journal-header .day-name { font-weight: 700; font-family: 'Inter', sans-serif; opacity: 0.7; font-size: 0.95rem; }
    .daily-journal-page .journal-section {
      margin: 8px 0;
      padding: 10px 14px;
      border: 2px solid #1e1a16;
      border-radius: 10px;
      background: #fcfaf8;
    }
    .daily-journal-page .journal-section-title { font-weight: 700; font-family: 'Inter', sans-serif; margin-bottom: 4px; font-size: 0.85rem; }
    .daily-journal-page .journal-lines { margin-top: 4px; }
    .daily-journal-page .journal-line { border-bottom: 1.5px dashed #aaa; height: 32px; margin-bottom: 2px; }

    /* Year Review Page */
    .year-review-page .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    .year-review-page .review-item {
      padding: 12px;
      border: 2px solid #1e1a16;
      border-radius: 12px;
      background: #fcfaf8;
    }
    .year-review-page .review-item .review-label { font-weight: 800; font-family: 'Inter', sans-serif; font-size: 0.85rem; display: block; margin-bottom: 4px; }
    .year-review-page .review-item .review-line { border-bottom: 1.5px dashed #888; height: 32px; }

    /* ——— RESPONSIVE ——— */
    @media (max-width: 768px) {
      .settings-panel { flex-direction: column; align-items: stretch; }
      .journal-page { padding: 20px 14px; }
      .journal-page.cover h1 { font-size: 2.8rem; }
      .journal-page.cover .year { font-size: 4.2rem; }
      .year-review-page .review-grid { grid-template-columns: 1fr; }
      .daily-journal-page .journal-header .date { font-size: 1.3rem; }
      .year-calendar-page .calendar-grid { grid-template-columns: 1fr 1fr; }
      .combined-planner-page .planner-grid-2col { grid-template-columns: 1fr; }
      .vision-board-page .bingo-grid { grid-template-columns: repeat(3, 1fr); }
      .weekly-planner-page .wp-top-grid, .weekly-planner-page .wp-bottom-grid { grid-template-columns: 1fr; }
      .weekly-planner-page .wp-day-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      .year-calendar-page .calendar-grid { grid-template-columns: 1fr; }
      .vision-board-page .bingo-grid { grid-template-columns: repeat(2, 1fr); }
      .vision-board-page .bingo-cell { font-size: 0.7rem; padding: 6px 3px; min-height: 50px; }
      .weekly-planner-page .wp-day-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>📓 2027 Full-Year Journal</h1>
    <p>Complete 365-Day & 52-Week Printable Layout</p>
  </header>

  <section class="settings-panel">
    <div class="settings-group"><label>Size:</label>
      <div class="btn-group">
        <button class="btn-size active" data-size="a4">A4</button>
        <button class="btn-size" data-size="a5">A5</button>
      </div>
    </div>
    <div class="settings-group"><label>Mode:</label>
      <div class="btn-group">
        <button class="btn-mode active" data-mode="full">Full 365 Days (~440 pgs)</button>
        <button class="btn-mode" data-mode="weekly">Weekly Planners Only (~80 pgs)</button>
      </div>
    </div>
    <button id="btn-generate" class="btn-generate">✨ Generate</button>
    <button id="btn-download" class="btn-download">📥 Download PDF</button>
  </section>

  <section id="journal-preview" class="journal-preview"></section>
</div>

<script>
  const DATA = {
    covers: [
      { name: 'Cute Flower', icon: '🌸' }, { name: 'Plant Lover', icon: '🌿' },
      { name: 'Polaroid', icon: '📷' }, { name: 'Elegant Floral', icon: '🌹' },
      { name: 'Minimalist', icon: '◼️' }, { name: 'Vintage', icon: '📜' }
    ],
    monthlyThemes: {
      January: ['Snow','Cozy','New Year'], February: ['Roses','Love','Chocolate'],
      March: ['Frogs','Rainbow','Spring'], April: ['Tulips','Butterflies','Rain'],
      May: ['Garden','Picnic','Flowers'], June: ['Sunshine','Beach','Art'],
      July: ['Travel','Fireworks','Camping'], August: ['Sea','Sunflowers','Sailing'],
      September: ['Leaves','Harvest','School'], October: ['Pumpkin','Spooky','Autumn'],
      November: ['Sweater','Thankful','Forest'], December: ['Snowmen','Gifts','Holiday']
    },
    journalPrompts: ['What made you smile?','What are you grateful for?','Goal for this week?','Happy memory?','Self‑care idea?','Letter to future self','What are you proud of?','Perfect day?','3 things you love','Challenge overcome?','Place to visit?','What does happiness mean?'],
    wellnessActivities: ['Meditate 5min','Walk in nature','Deep breathing','Journal','Stretch','Drink water','Gratitude','Read','Take a bath','Yoga','Healthy meal','8h sleep','Digital detox','Affirmations','Creative time'],
    budgetCategories: ['Housing','Utilities','Groceries','Transport','Insurance','Healthcare','Entertainment','Dining','Shopping','Savings','Emergency','Charity'],
    travelGoals: ['','','','','','','','']
  };

  let state = {
    size: 'a4',
    mode: 'full',
    includeVisionBoard: true,
    includeGoalSetting: true,
    includeYearlyReview: true,
    includeJournalPrompts: true,
    includeWellness: true,
    journal: []
  };

  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffleArray(arr) { const a = [...arr]; for (let i=a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function getMonthStartDay(month) { return new Date(2027, month-1, 1).getDay(); }

  // ——— GENERATION ENGINE ———
  function generateJournal() {
    const cover = randomPick(DATA.covers);
    const shuffledPrompts = shuffleArray(DATA.journalPrompts);
    const shuffledWellness = shuffleArray(DATA.wellnessActivities);

    let pages = [];

    // 1. Cover & Front Matter
    pages.push({ type: 'cover', cover, year: 2027 });
    pages.push({ type: 'year-calendar' });
    if (state.includeVisionBoard) pages.push({ type: 'vision-board', year: 2027 });
    pages.push({ type: 'combined-planner', year: 2027 });
    if (state.includeWellness) pages.push({ type: 'wellness', activities: shuffledWellness.slice(0, 12) });
    if (state.includeJournalPrompts) pages.push({ type: 'journal-prompts', prompts: shuffledPrompts.slice(0, 10) });

    // 2. Full Year 2027 Logic
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    let weekGlobalCounter = 1;

    for (let mi = 0; mi < 12; mi++) {
      const month = monthNames[mi];
      const numDays = daysInMonth[mi];
      let dayCounter = 1;

      while (dayCounter <= numDays) {
        const weekStart = dayCounter;
        let weekEnd = Math.min(dayCounter + 6, numDays);

        // Add Weekly Planner
        pages.push({
          type: 'weekly-planner',
          weekNumber: weekGlobalCounter++,
          month: mi + 1,
          year: 2027,
          startDate: weekStart,
          endDate: weekEnd
        });

        // Add Daily Pages if 'full' mode is active
        if (state.mode === 'full') {
          for (let d = weekStart; d <= weekEnd; d++) {
            const dateObj = new Date(2027, mi, d);
            const dayName = dayNames[dateObj.getDay()];
            pages.push({ type: 'daily-journal', month: month, day: d, year: 2027, dayName: dayName });
          }
        }

        dayCounter += 7;
      }

      // End of Month Reflection Pages
      pages.push({ type: 'reflection', month });
      pages.push({ type: 'free-thoughts', month });
    }

    // 3. Year Review End Page
    if (state.includeYearlyReview) pages.push({ type: 'year-review', year: 2027 });

  function generateYearCalendarPage() {
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    let calendarHtml = '';

    months.forEach((month, mi) => {
      const days = daysInMonth[mi];
      const startDay = getMonthStartDay(mi + 1);
      let daysHtml = '';
      ['S','M','T','W','T','F','S'].forEach(d => daysHtml += `<div class="day-header">${d}</div>`);
      for (let i = 0; i < startDay; i++) daysHtml += `<div class="day empty"></div>`;
      for (let d = 1; d <= days; d++) {
        const weekend = (startDay + d - 1) % 7 === 0 || (startDay + d - 1) % 7 === 6;
        daysHtml += `<div class="day ${weekend ? 'weekend' : ''}">${d}</div>`;
      }
      calendarHtml += `<div class="month-card"><div class="month-name">${month}</div><div class="month-grid">${daysHtml}</div></div>`;
    });

    return `<div class="journal-page year-calendar-page">
      <div class="section-title">📅 2027 Calendar</div>
      <div class="calendar-grid">${calendarHtml}</div>
    </div>`;
  }

  // ——— PDF DOWNLOAD ———
  async function downloadPDF() {
    const container = document.getElementById('journal-preview');
    const pages = container.querySelectorAll('.journal-page');
    if (!pages.length) return alert('Generate a journal first!');

    const btn = document.getElementById('btn-download');
    btn.textContent = '⏳ Rendering PDF...';
    btn.disabled = true;

    try {
      await document.fonts.ready;
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: state.size === 'a4' ? [595, 842] : [420, 595],
        hotfixes: ['px_scaling']
      });

      for (let i = 0; i < pages.length; i++) {
        btn.textContent = `⏳ ${Math.round(((i + 1) / pages.length) * 100)}%`;
        const canvas = await html2canvas(pages[i], {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
      }

      pdf.save(`2027_Full_Year_Journal.pdf`);
    } catch(e) {
      console.error(e);
      alert('Error rendering PDF. Try switching to Weekly Planners Mode for smaller rendering output.');
    }

    btn.textContent = '📥 Download PDF';
    btn.disabled = false;
  }
