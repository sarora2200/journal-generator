<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 B&W Journal · Print-Ready Fonts</title>
  <!-- Google Fonts – clean, print-friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,700;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
  
  <!-- html2canvas + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    /* ——— RESET & BASE ——— */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2efec;
      color: #1e1a16;
      padding: 24px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #app { max-width: 1200px; margin: 0 auto; }

    /* ——— HEADER ——— */
    header {
      text-align: center;
      padding: 28px 20px 22px;
      background: #faf8f6;
      border-radius: 28px;
      margin-bottom: 28px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 2.8rem;
      letter-spacing: -0.5px;
      color: #111;
    }
    header p {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2d2d2d;
      opacity: 0.8;
    }

    /* ——— SETTINGS ——— */
    .settings-panel {
      background: #faf8f6;
      padding: 22px 26px;
      border-radius: 24px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      margin-bottom: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
      justify-content: center;
    }
    .settings-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .settings-group label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #111;
      min-width: 60px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-group button {
      padding: 6px 16px;
      border: 2px solid #1e1a16;
      background: white;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      color: #1e1a16;
    }
    .btn-group button:hover { background: #e6e2dd; }
    .btn-group button.active {
      background: #1e1a16;
      color: white;
    }
    .btn-generate, .btn-download {
      padding: 12px 32px;
      border: 2px solid #1e1a16;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      background: white;
      color: #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    .btn-generate:hover, .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e1a16;
      background: #f0ede8;
    }
    .btn-generate:active, .btn-download:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e1a16;
    }

    /* ——— JOURNAL PREVIEW ——— */
    .journal-preview {
      background: #fcfaf8;
      padding: 28px 24px;
      border-radius: 28px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      min-height: 500px;
    }

    /* ——— PAGE STYLES – HIGH-PRECISION PRINT FONTS ——— */
    .journal-page {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 32px;
      padding: 40px 44px;
      background: white;
      border-radius: 12px;
      border: 2px solid #2d2d2d;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      page-break-after: always;
      position: relative;
      min-height: 700px;
      color: #1a1a1a;
      font-family: 'Source Serif 4', 'Georgia', serif;
      font-size: 11pt;
      line-height: 1.5;
    }

    .journal-page .section-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 2rem;
      border-bottom: 4px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 20px;
      letter-spacing: -0.2px;
      color: #111;
      line-height: 1.2;
    }

    .journal-page.dotted {
      background-image: radial-gradient(circle, #b8b0a8 1.4px, transparent 1.4px);
      background-size: 24px 24px;
      background-color: #ffffff;
    }

    /* ——— COVER ——— */
    .journal-page.cover {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 780px;
      border: 4px solid #1a1a1a;
      background: #faf8f6;
      font-family: 'Playfair Display', serif;
    }
    .journal-page.cover h1 {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #111;
      line-height: 1.1;
    }
    .journal-page.cover .year {
      font-size: 6.5rem;
      font-weight: 800;
      color: #111;
      border: 4px solid #111;
      padding: 0.05em 0.3em;
      border-radius: 20px;
      background: white;
      margin: 16px 0;
      line-height: 1;
    }
    .cover-icon {
      font-size: 5rem;
      margin-bottom: 8px;
      line-height: 1;
    }

    /* ——— MONTH GRID ——— */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
      font-weight: 600;
      font-size: 0.75rem;
      border: 2px solid #2d2d2d;
      border-radius: 8px;
      padding: 6px;
      background: #fcfaf8;
      font-family: 'Inter', sans-serif;
    }
    .month-grid .day-header {
      font-weight: 800;
      padding: 3px 0;
      color: #111;
      border-bottom: 2px solid #2d2d2d;
      font-size: 0.65rem;
    }
    .month-grid .day {
      padding: 4px 0;
      border-radius: 4px;
      font-weight: 700;
      background: white;
      font-size: 0.7rem;
    }
    .month-grid .day.weekend { color: #b13e3e; }
    .month-grid .day.empty { opacity: 0.25; }

    /* ——— YEAR CALENDAR PAGE ——— */
    .year-calendar-page .calendar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .year-calendar-page .month-card {
      border: 2px solid #1e1a16;
      border-radius: 10px;
      padding: 8px;
      background: #fcfaf8;
    }
    .year-calendar-page .month-card .month-name {
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 2px solid #1e1a16;
    }

    /* ——— VISION BOARD PAGE (Bingo Style) ——— */
    .vision-board-page .bingo-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 2.2rem;
      text-align: center;
      letter-spacing: 2px;
      color: #111;
      margin-bottom: 4px;
    }
    .vision-board-page .bingo-subtitle {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .vision-board-page .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .vision-board-page .bingo-cell {
      border: 2px solid #1e1a16;
      border-radius: 8px;
      padding: 12px 6px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      background: #fcfaf8;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }
    .vision-board-page .bingo-cell .icon {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 2px;
    }
    .vision-board-page .bingo-free {
      background: #1e1a16;
      color: white;
      font-size: 0.85rem;
    }
    .vision-board-page .bingo-footer {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 2px;
      border-top: 3px solid #1a1a1a;
      padding-top: 12px;
      margin-top: 6px;
      color: #111;
    }

    /* ——— COMBINED PLANNER PAGE (Goals + Travel + Budget) ——— */
    .combined-planner-page .section-title-sm {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 1.3rem;
      border-bottom: 3px solid #1a1a1a;
      padding-bottom: 4px;
      margin-bottom: 10px;
      color: #111;
    }
    .combined-planner-page .planner-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .combined-planner-page .planner-box {
      border: 2px solid #1e1a16;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fcfaf8;
    }
    .combined-planner-page .planner-box .box-label {
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 4px;
    }
    .combined-planner-page .planner-box .box-line {
      border-bottom: 2px dashed #888;
      height: 22px;
      margin-bottom: 2px;
    }
    .combined-planner-page .travel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 3px 0;
      border-bottom: 1px dashed #ddd;
    }
    .combined-planner-page .travel-item .check {
      opacity: 0.4;
      margin-left: auto;
    }
    .combined-planner-page .budget-item {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 3px 0;
      border-bottom: 1px dashed #ddd;
    }

    /* ============================================================
       CHEERFUL WEEKLY PLANNER STYLES
       ============================================================ */
    .weekly-planner-page {
      background: #ffffff;
      border-color: #2d2d2d;
    }
    .weekly-planner-page .wp-header {
      text-align: center;
      margin-bottom: 14px;
      padding: 12px 0;
      background: linear-gradient(135deg, #fdf6e3 0%, #fef9f0 100%);
      border-radius: 12px;
      border: 2px solid #e8d5b5;
    }
    .weekly-planner-page .wp-header .wp-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 700;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #2d1810;
    }
    .weekly-planner-page .wp-header .wp-title .heart {
      color: #e74c3c;
    }
    .weekly-planner-page .wp-header .wp-subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #5a3d2b;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .weekly-planner-page .wp-divider {
      border: none;
      border-top: 3px solid #e8d5b5;
      margin: 8px 0 12px 0;
    }
    .weekly-planner-page .wp-week-of {
      text-align: center;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #2d1810;
      background: #fef9f0;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      width: 100%;
      border: 2px solid #e8d5b5;
    }
    .weekly-planner-page .wp-week-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      margin: 8px 0 12px 0;
      padding: 6px 0;
      border-top: 2px solid #e8d5b5;
      border-bottom: 2px solid #e8d5b5;
      background: #fdf6e3;
      border-radius: 8px;
    }
    .weekly-planner-page .wp-week-days span {
      color: #2d1810;
    }
    .weekly-planner-page .wp-week-days span.weekend {
      color: #e74c3c;
    }
    .weekly-planner-page .wp-info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 8px 0;
    }
    .weekly-planner-page .wp-info-box {
      border: 2px solid #d4c5a9;
      border-radius: 10px;
      padding: 8px 12px;
      background: #fefcf7;
    }
    .weekly-planner-page .wp-info-box .wp-label {
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b6b4a;
    }
    .weekly-planner-page .wp-info-box .wp-value {
      font-weight: 600;
      font-size: 0.95rem;
      border-bottom: 2px dashed #d4c5a9;
      padding-bottom: 2px;
      min-height: 28px;
      color: #2d1810;
    }
    .weekly-planner-page .wp-section-title {
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #d4c5a9;
      padding-bottom: 4px;
      margin: 10px 0 6px 0;
      color: #5a3d2b;
    }
    .weekly-planner-page .wp-section-title .emoji {
      margin-right: 4px;
    }
    .weekly-planner-page .wp-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 4px 0 8px 0;
    }
    .weekly-planner-page .wp-grid-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 4px 0 8px 0;
    }
    .weekly-planner-page .wp-check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 2px 0;
      border-bottom: 1px dashed #e8ddd0;
      min-height: 24px;
      color: #2d1810;
    }
    .weekly-planner-page .wp-check-item .wp-check {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #b8a58a;
      border-radius: 4px;
      flex-shrink: 0;
      background: white;
      transition: background 0.2s;
    }
    .weekly-planner-page .wp-check-item .wp-check-text {
      flex: 1;
      border-bottom: 1px dashed #e8ddd0;
      padding-bottom: 2px;
    }
    .weekly-planner-page .wp-day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 6px 0 10px 0;
    }
    .weekly-planner-page .wp-day-box {
      border: 2px solid #d4c5a9;
      border-radius: 10px;
      padding: 6px 6px;
      background: #fefcf7;
      min-height: 70px;
      transition: all 0.2s;
    }
    .weekly-planner-page .wp-day-box.weekend {
      background: #fdf6f0;
      border-color: #e8c5b5;
    }
    .weekly-planner-page .wp-day-box .wp-day-name {
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      text-align: center;
      border-bottom: 2px solid #d4c5a9;
      padding-bottom: 3px;
      margin-bottom: 4px;
      color: #5a3d2b;
    }
    .weekly-planner-page .wp-day-box.weekend .wp-day-name {
      color: #e74c3c;
    }
    .weekly-planner-page .wp-day-box .wp-day-check {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      padding: 1px 0;
      border-bottom: 1px dashed #e8ddd0;
      min-height: 16px;
      font-family: 'Inter', sans-serif;
    }
    .weekly-planner-page .wp-day-box .wp-day-check .wp-small-check {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1.5px solid #b8a58a;
      border-radius: 3px;
      flex-shrink: 0;
      background: white;
    }
    .weekly-planner-page .wp-tracker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 6px 0;
    }
    .weekly-planner-page .wp-tracker-box {
      border: 2px solid #d4c5a9;
      border-radius: 10px;
      padding: 8px 12px;
      background: #fefcf7;
    }
    .weekly-planner-page .wp-tracker-box .wp-tracker-label {
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5a3d2b;
    }
    .weekly-planner-page .wp-tracker-box .wp-tracker-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px dashed #e8ddd0;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: #2d1810;
    }
    .weekly-planner-page .wp-tracker-box .wp-tracker-dots {
      display: flex;
      gap: 3px;
    }
    .weekly-planner-page .wp-tracker-box .wp-tracker-dot {
      width: 14px;
      height: 14px;
      border: 2px solid #b8a58a;
      border-radius: 50%;
      display: inline-block;
      background: white;
      transition: background 0.2s;
    }
    .weekly-planner-page .wp-tracker-box .wp-tracker-dot.filled {
      background: #6a9b6a;
      border-color: #6a9b6a;
    }
    .weekly-planner-page .wp-energy-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 4px 0 8px 0;
    }
    .weekly-planner-page .wp-energy-item {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      border: 2px solid #d4c5a9;
      border-radius: 8px;
      padding: 4px 2px;
      background: #fefcf7;
      transition: all 0.2s;
    }
    .weekly-planner-page .wp-energy-item .wp-energy-day {
      font-weight: 800;
      font-size: 0.6rem;
      text-transform: uppercase;
      color: #8b6b4a;
    }
    .weekly-planner-page .wp-energy-item .wp-energy-dots {
      display: flex;
      gap: 2px;
      justify-content: center;
      margin-top: 2px;
    }
    .weekly-planner-page .wp-energy-item .wp-energy-dot {
      width: 12px;
      height: 12px;
      border: 1.5px solid #b8a58a;
      border-radius: 50%;
      display: inline-block;
      background: white;
      transition: background 0.2s;
    }
    .weekly-planner-page .wp-energy-item .wp-energy-dot.filled {
      background: #f0a070;
      border-color: #f0a070;
    }
    .weekly-planner-page .wp-notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 6px 0;
    }
    .weekly-planner-page .wp-notes-box {
      border: 2px solid #d4c5a9;
      border-radius: 10px;
      padding: 8px 12px;
      background: #fefcf7;
      min-height: 50px;
    }
    .weekly-planner-page .wp-notes-box .wp-notes-label {
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #d4c5a9;
      padding-bottom: 3px;
      margin-bottom: 4px;
      color: #5a3d2b;
    }
    .weekly-planner-page .wp-notes-box .wp-notes-line {
      border-bottom: 1px dashed #e8ddd0;
      height: 20px;
      margin-bottom: 2px;
    }
    .weekly-planner-page .wp-reminder {
      border: 2px solid #e8d5b5;
      border-radius: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, #fdf6e3 0%, #fef9f0 100%);
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 10px;
      letter-spacing: 2px;
      color: #5a3d2b;
    }

    /* ——— DAILY JOURNAL PAGE STYLES ——— */
    .daily-journal-page .journal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #111;
      padding-bottom: 10px;
      margin-bottom: 18px;
    }
    .daily-journal-page .journal-header .date {
      font-size: 2rem;
      font-weight: 900;
      font-family: 'Playfair Display', serif;
    }
    .daily-journal-page .journal-header .day-name {
      font-weight: 700;

  function generateYearCalendarPage() {
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                    'July', 'August', 'September', 'October', 'November', 'December'];
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    
    let calendarHtml = '';
    
    months.forEach((month, mi) => {
      const days = daysInMonth[mi];
      const startDay = getMonthStartDay(mi + 1);
      
      let daysHtml = '';
      ['S','M','T','W','T','F','S'].forEach(d => daysHtml += `<div class="day-header">${d}</div>`);
      for (let i = 0; i < startDay; i++) daysHtml += `<div class="day empty"></div>`;
      for (let d = 1; d <= days; d++) {
        const weekend = (startDay + d - 1) % 7 === 0 || (startDay + d - 1) % 7 === 6;
        daysHtml += `<div class="day ${weekend ? 'weekend' : ''}">${d}</div>`;
      }
      
      calendarHtml += `
        <div class="month-card">
          <div class="month-name">${month}</div>
          <div class="month-grid">${daysHtml}</div>
        </div>
      `;
    });

  // ============================================================
  // JOURNAL GENERATION
  // ============================================================
  function generateJournal() {
    const cover = randomPick(DATA.covers);
    const months = Object.keys(DATA.monthlyThemes);
    const shuffledPrompts = shuffleArray(DATA.journalPrompts);
    const shuffledWellness = shuffleArray(DATA.wellnessActivities);

    let pages = [];
    let pageCount = 0;
    const target = state.pageCount;

    // Front pages
    pages.push({ type: 'cover', cover, year: 2026 }); pageCount++;
    pages.push({ type: 'year-calendar' }); pageCount++;
    if (state.includeVisionBoard) {
      pages.push({ type: 'vision-board', year: 2026 }); 
      pageCount++;
    }
    pages.push({ type: 'combined-planner', year: 2026 }); pageCount++;
    if (state.includeWellness) { 
      pages.push({ type: 'wellness', activities: shuffledWellness.slice(0, 12) }); 
      pageCount++; 
    }
    if (state.includeJournalPrompts) { 
      pages.push({ type: 'journal-prompts', prompts: shuffledPrompts.slice(0, 10) }); 
      pageCount++; 
    }

    // Generate weekly planners for each month
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    
    for (let mi = 0; mi < months.length && pageCount < target; mi++) {
      const month = months[mi];
      const monthIndex = mi + 1;
      const numDays = daysInMonth[mi];
      
      let weekNumber = 1;
      let dayCounter = 1;
      
      while (dayCounter <= numDays && pageCount < target) {
        const weekStart = dayCounter;
        let weekEnd = Math.min(dayCounter + 6, numDays);
        
        pages.push({ 
          type: 'weekly-planner', 
          weekNumber: weekNumber,
          month: monthIndex,
          year: 2026,
          startDate: weekStart,
          endDate: weekEnd
        });
        pageCount++; if (pageCount >= target) break;
        
        // Add daily journal pages for each day in this week
        for (let d = weekStart; d <= weekEnd && pageCount < target; d++) {
          const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
          const dateObj = new Date(2026, mi, d);
          const dayName = dayNames[dateObj.getDay()];
          pages.push({ type: 'daily-journal', month: month, day: d, year: 2026, dayName: dayName });
          pageCount++; if (pageCount >= target) break;
        }
        
        dayCounter += 7;
        weekNumber++;
      }
      
      if (pageCount >= target) break;

      pages.push({ type: 'reflection', month });
      pageCount++; if (pageCount >= target) break;
      
      pages.push({ type: 'free-thoughts', month });
      pageCount++; if (pageCount >= target) break;
    }

    // Year Review at the end
    if (state.includeYearlyReview) {
      pages.push({ type: 'year-review', year: 2026 });
      pageCount++;
    }

    state.journal = pages;
    renderJournal(pages);
  }

  function renderJournal(pages) {
    const container = document.getElementById('journal-preview');
    let html = `<div class="journal-container">`;
    pages.forEach(p => { html += renderPage(p); });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderPage(page) {
    switch (page.type) {
      case 'year-calendar': return generateYearCalendarPage();
      case 'vision-board': return generateVisionBoardPage(page.year);
      case 'combined-planner': return generateCombinedPlannerPage(page.year);
      case 'weekly-planner': return generateWeeklyPlannerPage(
        page.weekNumber, 
        page.month, 
        page.year, 
        page.startDate, 
        page.endDate
      );
      case 'daily-journal': return generateDailyJournalPage(page.month, page.day, page.year, page.dayName);
      case 'year-review': return generateYearReviewPage(page.year);
      case 'cover': return renderCover(page);
      case 'wellness': return renderWellness(page);
      case 'journal-prompts': return renderJournalPrompts(page);
      case 'reflection': return renderReflection(page);
      case 'free-thoughts': return renderFreeThoughts(page);
      default: return '';
    }
  }

  // ============================================================
  // PDF EXPORT
  // ============================================================
  async function downloadPDF() {
    const container = document.getElementById('journal-preview');
    const pages = container.querySelectorAll('.journal-page');
    if (!pages.length) { alert('Generate a journal first!'); return; }

    const btn = document.getElementById('btn-download');
    btn.textContent = '⏳ Preparing Fonts...';
    btn.disabled = true;

    try {
      await document.fonts.ready;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: state.size === 'a4' ? [595, 842] : [420, 595],
        hotfixes: ['px_scaling']
      });

      const total = pages.length;

      for (let i = 0; i < total; i++) {
        btn.textContent = `⏳ ${Math.round(((i + 1) / total) * 100)}%`;

        const canvas = await html2canvas(pages[i], {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          logging: false,
          width: pages[i].offsetWidth,
          height: pages[i].offsetHeight,
          onclone: (clonedDoc) => {
            const style = clonedDoc.createElement('style');
            style.innerHTML = `
              * {
                -webkit-font-smoothing: antialiased !important;
                -moz-osx-font-smoothing: grayscale !important;
                text-rendering: optimizeLegibility !important;
              }
            `;
            clonedDoc.head.appendChild(style);
          }
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.98);
        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
      }

      pdf.save(`2026_BW_journal_${state.pageCount}pages.pdf`);
    } catch(e) {
      console.error(e);
      alert('PDF generation error');
    }

    btn.textContent = '📥 PDF';
    btn.disabled = false;
  }
