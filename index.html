<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 B&W Journal · Coloring Icons</title>
  <!-- Google Fonts – clean, print-friendly -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <!-- html2canvas + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ——— RESET & BASE ——— */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f2efec;
      color: #1e1a16;
      padding: 24px;
      line-height: 1.5;
    }
    #app { max-width: 1200px; margin: 0 auto; }

    /* ——— HEADER (monochrome) ——— */
    header {
      text-align: center;
      padding: 28px 20px 22px;
      background: #faf8f6;
      border-radius: 28px;
      margin-bottom: 28px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.8rem;
      letter-spacing: -0.5px;
      color: #111;
    }
    header p {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2d2d2d;
      opacity: 0.8;
    }

    /* ——— SETTINGS (monochrome) ——— */
    .settings-panel {
      background: #faf8f6;
      padding: 22px 26px;
      border-radius: 24px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      margin-bottom: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
      justify-content: center;
    }
    .settings-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .settings-group label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #111;
      min-width: 60px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-group button {
      padding: 6px 16px;
      border: 2px solid #1e1a16;
      background: white;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      color: #1e1a16;
    }
    .btn-group button:hover { background: #e6e2dd; }
    .btn-group button.active {
      background: #1e1a16;
      color: white;
    }
    .btn-generate, .btn-download {
      padding: 12px 32px;
      border: 2px solid #1e1a16;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      background: white;
      color: #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
    }
    .btn-generate:hover, .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e1a16;
      background: #f0ede8;
    }
    .btn-generate:active, .btn-download:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e1a16;
    }

    /* ——— JOURNAL PREVIEW ——— */
    .journal-preview {
      background: #fcfaf8;
      padding: 28px 24px;
      border-radius: 28px;
      border: 2px solid #1e1a16;
      box-shadow: 0 4px 0 #1e1a16;
      min-height: 500px;
    }

    /* ——— PAGE STYLES (B&W, high contrast, coloring icons) ——— */
    .journal-page {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 32px;
      padding: 40px 44px;
      background: white;
      border-radius: 12px;
      border: 2px solid #2d2d2d;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      page-break-after: always;
      position: relative;
      min-height: 700px;
      color: #1a1a1a;
    }
    /* dotted background – subtle grey dots */
    .journal-page.dotted {
      background-image: radial-gradient(circle, #b8b0a8 1.4px, transparent 1.4px);
      background-size: 24px 24px;
      background-color: #ffffff;
    }

    /* ——— COVER ——— */
    .journal-page.cover {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 780px;
      border: 4px solid #1a1a1a;
      background: #faf8f6;
    }
    .journal-page.cover h1 {
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #111;
    }
    .journal-page.cover .year {
      font-size: 7rem;
      font-weight: 800;
      color: #111;
      border: 4px solid #111;
      padding: 0.1em 0.4em;
      border-radius: 20px;
      background: white;
    }
    .journal-page.cover .subtitle {
      font-size: 1.3rem;
      font-weight: 600;
      opacity: 0.7;
    }
    .cover-icon {
      font-size: 5rem;
      filter: grayscale(0%) !important;
      transition: none;
      margin-bottom: 8px;
    }

    /* ——— section title ——— */
    .section-title {
      font-weight: 800;
      font-size: 1.9rem;
      border-bottom: 4px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
      color: #111;
    }

    /* ——— MONTH GRID ——— */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      border: 2px solid #2d2d2d;
      border-radius: 12px;
      padding: 10px;
      background: #fcfaf8;
    }
    .month-grid .day-header {
      font-weight: 800;
      padding: 8px 0;
      color: #111;
      border-bottom: 3px solid #2d2d2d;
    }
    .month-grid .day {
      padding: 10px 0;
      border-radius: 6px;
      font-weight: 700;
      background: white;
    }
    .month-grid .day.weekend { color: #b13e3e; }
    .month-grid .day.empty { opacity: 0.25; }

    /* ——— MOOD TRACKER (coloring icons) ——— */
    .mood-tracker-page .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 560px;
      margin: 18px auto;
    }
    .mood-tracker-page .mood-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      border-radius: 16px;
      border: 2.5px solid #1e1a16;
      background: #fcfaf8;
    }
    .mood-tracker-page .mood-item .emoji {
      font-size: 2.8rem;
      filter: grayscale(0%) !important;
    }
    .mood-tracker-page .mood-item .label {
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 4px;
      color: #111;
    }
    .mood-tracker-page .mood-item .checkbox {
      margin-top: 8px;
      width: 24px;
      height: 24px;
      border: 3px solid #1e1a16;
      border-radius: 4px;
      background: white;
    }
    .mood-tracker-page .mood-doodle {
      font-size: 5.5rem;
      margin: 10px 0;
      padding: 16px;
      border-radius: 60px;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2efec;
      border: 4px solid #1a1a1a;
      filter: grayscale(0%) !important;
    }

    /* ——— TRACKERS ——— */
    .tracker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 16px;
    }
    .tracker-item {
      padding: 14px 16px;
      border: 2px solid #2d2d2d;
      border-radius: 12px;
      background: #fcfaf8;
      font-weight: 600;
    }
    .tracker-item .label { font-weight: 800; display: block; margin-bottom: 6px; }
    .tracker-item .dots { display: flex; gap: 8px; flex-wrap: wrap; }
    .tracker-item .dot {
      width: 24px; height: 24px;
      border: 2.5px solid #1e1a16;
      border-radius: 50%;
      display: inline-block;
      background: white;
    }

    /* ——— DOODLE GRID (coloring icons) ——— */
    .doodle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 16px;
    }
    .doodle-item {
      text-align: center;
      padding: 16px 6px;
      border: 2px solid #2d2d2d;
      border-radius: 14px;
      background: #fcfaf8;
      font-weight: 700;
    }
    .doodle-item .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 6px;
      filter: grayscale(0%) !important;
    }

    /* ——— FREE THOUGHTS ——— */
    .free-thoughts-page {
      min-height: 700px;
      display: flex;
      flex-direction: column;
    }
    .free-thoughts-page .thought-lines {
      flex: 1;
      margin-top: 14px;
    }
    .free-thoughts-page .thought-line {
      border-bottom: 2px solid #b8b0a8;
      padding: 14px 0 8px;
      margin-bottom: 4px;
      font-size: 1.1rem;
      color: #1a1a1a;
      min-height: 54px;
      background: repeating-linear-gradient(transparent, transparent 52px, #d0c8c0 52px, #d0c8c0 54px);
      background-size: 100% 54px;
      background-position: 0 10px;
    }
    .free-thoughts-page .thought-line:last-child { min-height: 120px; }

    /* ——— BUDGET, WELLNESS, etc ——— */
    .journal-page ul, .journal-page li { font-weight: 500; }
    .seasonal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .season-card { padding: 20px; border: 2px solid #2d2d2d; border-radius: 16px; background: #fcfaf8; }
    .bucket-list li { padding: 6px 0 6px 30px; border-bottom: 1px solid #d0c8c0; }

    /* ——— RESPONSIVE ——— */
    @media (max-width: 768px) {
      .settings-panel { flex-direction: column; align-items: stretch; }
      .journal-page { padding: 24px 18px; }
      .tracker-grid, .doodle-grid, .seasonal-grid { grid-template-columns: 1fr; }
      .mood-tracker-page .mood-grid { grid-template-columns: 1fr 1fr; }
      .journal-page.cover h1 { font-size: 2.8rem; }
      .journal-page.cover .year { font-size: 4.2rem; }
    }

    /* ——— PRINT ——— */
    @media print {
      .settings-panel, header, .btn-generate, .btn-download { display: none !important; }
      .journal-preview { padding: 0; border: none; box-shadow: none; background: none; }
      .journal-page {
        box-shadow: none; border: 1px solid #555;
        border-radius: 0; page-break-after: always;
        min-height: 100vh; padding: 36px 40px;
        background: white !important;
        color: black !important;
      }
      .journal-page.dotted { background-image: radial-gradient(circle, #bbb 1.4px, transparent 1.4px); }
      .section-title { border-bottom-color: #222; }
      .month-grid { border-color: #555; }
      .mood-tracker-page .mood-item { border-color: #333; }
      .tracker-item, .doodle-item { border-color: #333; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>📓 2026 B&W Journal</h1>
    <p>Coloring Icons • 200+ Pages • Print Ready</p>
  </header>

  <section class="settings-panel">
    <div class="settings-group"><label>Size:</label>
      <div class="btn-group">
        <button class="btn-size active" data-size="a4">A4</button>
        <button class="btn-size" data-size="a5">A5</button>
      </div>
    </div>
    <div class="settings-group"><label>Background:</label>
      <div class="btn-group">
        <button class="btn-bg active" data-bg="dots">Dots</button>
        <button class="btn-bg" data-bg="plain">Plain</button>
      </div>
    </div>
    <div class="settings-group"><label>Pages:</label>
      <div class="btn-group">
        <button class="btn-pages active" data-pages="200">200</button>
        <button class="btn-pages" data-pages="300">300</button>
        <button class="btn-pages" data-pages="400">400</button>
      </div>
    </div>
    <button id="btn-generate" class="btn-generate">✨ Generate</button>
    <button id="btn-download" class="btn-download">📥 PDF</button>
  </section>

  <section id="journal-preview" class="journal-preview"></section>
</div>

<script>
  // ============================================================
  // DATA – all icons remain full‑color (coloring pages)
  // ============================================================
  const DATA = {
    covers: [
      { name: 'Cute Flower', icon: '🌸' }, { name: 'Plant Lover', icon: '🌿' },
      { name: 'Polaroid', icon: '📷' }, { name: 'Elegant Floral', icon: '🌹' },
      { name: 'Minimalist', icon: '◼️' }, { name: 'Vintage', icon: '📜' }
    ],
    monthlyThemes: {
      January: ['Snow','Cozy','New Year'], February: ['Roses','Love','Chocolate'],
      March: ['Frogs','Rainbow','Spring'], April: ['Tulips','Butterflies','Rain'],
      May: ['Garden','Picnic','Flowers'], June: ['Sunshine','Beach','Art'],
      July: ['Travel','Fireworks','Camping'], August: ['Sea','Sunflowers','Sailing'],
      September: ['Leaves','Harvest','School'], October: ['Pumpkin','Spooky','Autumn'],
      November: ['Sweater','Thankful','Forest'], December: ['Snowmen','Gifts','Holiday']
    },
    moodOptions: [
      { label: 'Energetic', emoji: '⚡' }, { label: 'Happy', emoji: '😊' },
      { label: 'Ok', emoji: '😐' }, { label: 'Tired', emoji: '😴' },
      { label: 'Calm', emoji: '😌' }, { label: 'Excited', emoji: '🤩' },
      { label: 'Grateful', emoji: '🙏' }, { label: 'Loved', emoji: '❤️' },
      { label: 'Peaceful', emoji: '🕊️' }, { label: 'Motivated', emoji: '💪' },
      { label: 'Inspired', emoji: '✨' }, { label: 'Playful', emoji: '🎭' }
    ],
    moodDoodles: [
      { name: 'Apple', emoji: '🍎' }, { name: 'Bookshelf', emoji: '📚' },
      { name: 'Camping', emoji: '⛺' }, { name: 'Cherry Blossom', emoji: '🌸' },
      { name: 'Disco Ball', emoji: '🪩' }, { name: 'Frog', emoji: '🐸' },
      { name: 'Ladybug', emoji: '🐞' }, { name: 'Love Letter', emoji: '💌' },
      { name: 'Pumpkin', emoji: '🎃' }, { name: 'Rose', emoji: '🌹' },
      { name: 'Sunflower', emoji: '🌻' }, { name: 'Tulip', emoji: '🌷' }
    ],
    doodles: ['Apple','Bear','Bunny','Candy Cane','Cloud','Deer','Firework','Frog','Ladybug','Latte','Penguin','Pie','Sailboat','Star','Sunflower','Rainbow','Heart','Moon','Cactus','Butterfly','Leaf','Compass','Mountain','Shell','Key'],
    monthlyPages: ['Habit Tracker','Gratitude','Sleep','Water','Movies','Books','Playlist','Affirmations','Meal Planner','To-Do','Reflections','Bucket List'],
    journalPrompts: ['What made you smile?','What are you grateful for?','Goal for this week?','Happy memory?','Self‑care idea?','Letter to future self','What are you proud of?','Perfect day?','3 things you love','Challenge overcome?','Place to visit?','What does happiness mean?'],
    wellnessActivities: ['Meditate 5min','Walk in nature','Deep breathing','Journal','Stretch','Drink water','Gratitude','Read','Take a bath','Yoga','Healthy meal','8h sleep','Digital detox','Affirmations','Creative time'],
    budgetCategories: ['Housing','Utilities','Groceries','Transport','Insurance','Healthcare','Entertainment','Dining','Shopping','Savings','Emergency','Charity'],
    travelDestinations: ['Paris','Bali','Tokyo','New York','Rome','Sydney','Cape Town','Dubai','Barcelona','London','Rio','Bangkok','Santorini','Maldives','Vancouver','Amsterdam'],
    fonts: ['Inter','Playfair Display','Lora']
  };

  // ============================================================
  // STATE (B&W theme: we keep colors only for icons)
  // ============================================================
  let state = {
    size: 'a4',
    background: 'dots',
    pageCount: 200,
    includeVisionBoard: true,
    includeGoalSetting: true,
    includeYearlyReview: true,
    includeWeeklyPlanner: true,
    includeJournalPrompts: true,
    includeWellness: true,
    includeBudget: true,
    includePasswordTracker: true,
    includeTravelBucket: true,
    journal: null
  };

  // helpers
  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffleArray(arr) { const a = [...arr]; for (let i=a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function getMonthDays(month) { return new Date(2026, month, 0).getDate(); }
  function getMonthStartDay(month) { return new Date(2026, month-1, 1).getDay(); }
  function getMoodColors() { return DATA.moodOptions.slice(0,6); }
  function getDoodleEmoji(name) {
    const map = { 'Apple':'🍎','Bear':'🐻','Bunny':'🐰','Candy Cane':'🍭','Cloud':'☁️','Deer':'🦌','Firework':'🎆','Frog':'🐸','Ladybug':'🐞','Latte':'☕','Penguin':'🐧','Pie':'🥧','Sailboat':'⛵','Star':'⭐','Sunflower':'🌻','Rainbow':'🌈','Heart':'💖','Moon':'🌙','Cactus':'🌵','Butterfly':'🦋','Leaf':'🍃','Compass':'🧭','Mountain':'🏔️','Shell':'🐚','Key':'🔑' };
    return map[name] || '✨';
  }

  // ============================================================
  // GENERATOR
  // ============================================================
  function generateJournal() {
    const font = randomPick(DATA.fonts);
    const cover = randomPick(DATA.covers);
    const months = Object.keys(DATA.monthlyThemes);
    const shuffledDoodles = shuffleArray(DATA.doodles);
    const shuffledMoodDoodles = shuffleArray(DATA.moodDoodles);
    const moods = getMoodColors();
    const shuffledPrompts = shuffleArray(DATA.journalPrompts);
    const shuffledWellness = shuffleArray(DATA.wellnessActivities);
    const shuffledDest = shuffleArray(DATA.travelDestinations);

    let pages = [];
    let pageCount = 0;
    const target = state.pageCount;

    // 1. COVER
    pages.push({ type: 'cover', cover, font, year:2026 });
    pageCount++;

    // 2. VISION
    if (state.includeVisionBoard) { pages.push({ type: 'vision-board', font, year:2026 }); pageCount++; }
    if (state.includeGoalSetting) { pages.push({ type: 'goals', font, year:2026 }); pageCount++; }
    if (state.includeYearlyReview) { pages.push({ type: 'yearly-review', font, year:2026 }); pageCount++; }
    if (state.includeTravelBucket) { pages.push({ type: 'travel-bucket', destinations: shuffledDest.slice(0,10), font }); pageCount++; }
    if (state.includeBudget) { pages.push({ type: 'budget', categories: DATA.budgetCategories.slice(0,10), font, year:2026 }); pageCount++; }
    if (state.includePasswordTracker) { pages.push({ type: 'password-tracker', font }); pageCount++; }
    if (state.includeWellness) { pages.push({ type: 'wellness', activities: shuffledWellness.slice(0,12), font }); pageCount++; }
    if (state.includeJournalPrompts) { pages.push({ type: 'journal-prompts', prompts: shuffledPrompts.slice(0,10), font }); pageCount++; }
    if (state.includeWeeklyPlanner) {
      for (let w=1; w<=4 && pageCount<target; w++) {
        pages.push({ type: 'weekly-planner', week: w, month: months[w%12], font });
        pageCount++;
      }
    }

    // MONTHLY PAGES
    for (let mi=0; mi<months.length && pageCount<target; mi++) {
      const month = months[mi];
      const themeOpt = DATA.monthlyThemes[month];
      const chosenTheme = randomPick(themeOpt);
      const moodDoodle = shuffledMoodDoodles[mi % shuffledMoodDoodles.length];
      const days = getMonthDays(mi+1);
      const start = getMonthStartDay(mi+1);

      pages.push({ type: 'month', month, theme: chosenTheme, moodDoodle, daysInMonth: days, startDay: start, font });
      pageCount++; if (pageCount>=target) break;

      pages.push({ type: 'mood-tracker', month, moodDoodle, moods, font });
      pageCount++; if (pageCount>=target) break;

      const trackers = shuffleArray(DATA.monthlyPages).slice(0,6);
      pages.push({ type: 'trackers', month, trackers, font });
      pageCount++; if (pageCount>=target) break;

      const doodSet = shuffleArray(DATA.doodles).slice(0,6);
      pages.push({ type: 'month-doodles', month, doodles: doodSet, font });
      pageCount++; if (pageCount>=target) break;

      pages.push({ type: 'reflection', month, font });
      pageCount++; if (pageCount>=target) break;

      // FREE THOUGHTS
      pages.push({ type: 'free-thoughts', month, font });
      pageCount++; if (pageCount>=target) break;
    }

    // FILL EXTRA
    while (pageCount < target) {
      const extra = randomPick(['free-thoughts','doodles','trackers','reflection','journal-prompts','wellness']);
      if (extra === 'free-thoughts') {
        pages.push({ type: 'free-thoughts', month: 'Reflect', font });
        pageCount++;
      } else if (extra === 'doodles') {
        pages.push({ type: 'doodles', doodles: shuffleArray(DATA.doodles).slice(0,8), font });
        pageCount++;
      } else if (extra === 'trackers') {
        pages.push({ type: 'trackers', month: 'Extra', trackers: shuffleArray(DATA.monthlyPages).slice(0,6), font });
        pageCount++;
      } else if (extra === 'reflection') {
        pages.push({ type: 'reflection', month: 'Reflection', font });
        pageCount++;
      } else if (extra === 'journal-prompts') {
        pages.push({ type: 'journal-prompts', prompts: shuffleArray(DATA.journalPrompts).slice(0,8), font });
        pageCount++;
      } else if (extra === 'wellness') {
        pages.push({ type: 'wellness', activities: shuffleArray(DATA.wellnessActivities).slice(0,10), font });
        pageCount++;
      }
    }

    state.journal = pages;
    renderJournal(pages);
  }

  // ============================================================
  // RENDER (B&W, icons keep color)
  // ============================================================
  function renderJournal(pages) {
    const container = document.getElementById('journal-preview');
    const dotClass = state.background === 'dots' ? 'dotted' : 'plain';
    let html = `<div class="journal-container">`;
    pages.forEach(p => { html += renderPage(p); });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderPage(page) {
    switch (page.type) {
      case 'cover': return renderCover(page);
      case 'vision-board': return renderVisionBoard(page);
      case 'goals': return renderGoals(page);
      case 'yearly-review': return renderYearlyReview(page);
      case 'travel-bucket': return renderTravelBucket(page);

  // ============================================================
  // PDF EXPORT
  // ============================================================
  async function downloadPDF() {
    const container = document.getElementById('journal-preview');
    const pages = container.querySelectorAll('.journal-page');
    if (!pages.length) { alert('Generate a journal first!'); return; }
    const btn = document.getElementById('btn-download');
    btn.textContent = '⏳ Generating... 0%';
    btn.disabled = true;
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'px', format: state.size==='a4' ? [595,842] : [420,595], hotfixes:['px_scaling'] });
      const total = pages.length;
      for (let i=0; i<total; i++) {
        btn.textContent = `⏳ ${Math.round((i+1)/total*100)}%`;
        const canvas = await html2canvas(pages[i], { scale:2.2, useCORS:true, allowTaint:true, backgroundColor:'#ffffff', logging:false, width:pages[i].scrollWidth, height:pages[i].scrollHeight });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
        if (i>0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
      }
      pdf.save(`2026_BW_journal_${state.pageCount}pages.pdf`);
    } catch(e) { console.error(e); alert('PDF error'); }
    btn.textContent = '📥 PDF';
    btn.disabled = false;
  }

  // ============================================================
  // EVENTS
  // ============================================================
  document.querySelectorAll('.btn-size').forEach(b => b.addEventListener('click', function() { document.querySelectorAll('.btn-size').forEach(x=>x.classList.remove('active')); this.classList.add('active'); state.size=this.dataset.size; }));
  document.querySelectorAll('.btn-bg').forEach(b => b.addEventListener('click', function() { document.querySelectorAll('.btn-bg').forEach(x=>x.classList.remove('active')); this.classList.add('active'); state.background=this.dataset.bg; }));
  document.querySelectorAll('.btn-pages').forEach(b => b.addEventListener('click', function() { document.querySelectorAll('.btn-pages').forEach(x=>x.classList.remove('active')); this.classList.add('active'); state.pageCount=parseInt(this.dataset.pages); }));
  document.getElementById('btn-generate').addEventListener('click', generateJournal);
  document.getElementById('btn-download').addEventListener('click', downloadPDF);
  document.addEventListener('DOMContentLoaded', generateJournal);
